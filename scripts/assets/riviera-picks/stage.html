<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#bfe3f2}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const W = 300, H = 300;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const bg = document.createElement('canvas'); bg.width = 4; bg.height = 256; const bx = bg.getContext('2d');
const gr = bx.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#8fcbe8'); gr.addColorStop(0.62, '#d8eef5'); gr.addColorStop(0.63, '#efe3c6'); gr.addColorStop(1, '#e6d4ae');
bx.fillStyle = gr; bx.fillRect(0, 0, 4, 256); const bt = new THREE.CanvasTexture(bg); bt.colorSpace = THREE.SRGBColorSpace; scene.background = bt;
scene.add(new THREE.HemisphereLight(0xd6ecff, 0xe9d7b0, 1.35));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.ShadowMaterial({ opacity: 0.22 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 2000);
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0 });
let mesh = null;
const b64 = (s, T) => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
window.show = async (url, yaw = 35) => {
  const d = await (await fetch(url)).json();
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(d.p, Float32Array), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(b64(d.n, Float32Array), 3));
  const c8 = b64(d.c, Uint8Array), cf = new Float32Array(c8.length), tc = new THREE.Color();
  for (let i = 0; i < c8.length; i += 3) { tc.setRGB(c8[i] / 255, c8[i + 1] / 255, c8[i + 2] / 255, THREE.SRGBColorSpace); cf[i] = tc.r; cf[i + 1] = tc.g; cf[i + 2] = tc.b; }
  g.setAttribute('color', new THREE.BufferAttribute(cf, 3)); g.setIndex(new THREE.BufferAttribute(b64(d.i, Uint32Array), 1));
  g.computeBoundingBox(); const bb = g.boundingBox; const ctr = bb.getCenter(new THREE.Vector3());
  g.translate(-ctr.x, -bb.min.y, -ctr.z); g.computeBoundingSphere();
  mesh = new THREE.Mesh(g, mat); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
  const R = g.boundingSphere.radius, cy = (bb.max.y - bb.min.y) / 2;
  ground.scale.setScalar(R * 1.6);
  const a = yaw * Math.PI / 180, pitch = 28 * Math.PI / 180, dist = R / Math.sin(15 * Math.PI / 180) * 1.02;
  cam.position.set(Math.sin(a) * Math.cos(pitch) * dist, cy + Math.sin(pitch) * dist, Math.cos(a) * Math.cos(pitch) * dist);
  cam.near = dist / 50; cam.far = dist * 4; cam.updateProjectionMatrix(); cam.lookAt(0, cy, 0);
  sun.position.set(-R * 2, R * 4, R * 3); sun.target.position.set(0, 0, 0);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -R * 2; sc.right = sc.top = R * 2; sc.near = 0.01; sc.far = R * 12; sc.updateProjectionMatrix();
  r.render(scene, cam);
  return { label: d.label, tris: d.tris, size: d.size, src: d.src };
};
window.ready = true;
</script></body></html>
