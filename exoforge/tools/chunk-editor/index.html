<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EXOFORGE chunk editor</title>
    <style>
      :root { color-scheme: dark; --bg: #15131c; --panel: #201d2a; --line: #3a3446; --text: #e8e2f0; --accent: #4fd1c5; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 320px; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; }
      #view { position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      aside { background: var(--panel); border-left: 1px solid var(--line); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      h1 { font-size: 15px; margin: 0; }
      .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      button, select, input { font: inherit; color: var(--text); background: #2c2838; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
      button.on { border-color: var(--accent); color: var(--accent); }
      label { display: flex; gap: 6px; align-items: center; }
      input[type='number'] { width: 70px; }
      #issues { white-space: pre-wrap; color: #ffb3a0; min-height: 1.4em; }
      #issues.ok { color: #9fe7a0; }
      #help { color: #b8aac4; }
      #status { color: var(--accent); min-height: 1.3em; }
    </style>
  </head>
  <body>
    <div id="view"><canvas id="canvas"></canvas></div>
    <aside>
      <h1>EXOFORGE chunk editor</h1>
      <div class="row"><select id="pick"></select><button id="new">New</button></div>
      <div class="row">
        <label>id <input id="id" size="7" /></label>
        <label>name <input id="name" size="12" /></label>
      </div>
      <div class="row">
        <label>width <input id="width" type="number" step="0.5" /></label>
        <label>height <input id="height" type="number" step="0.5" /></label>
      </div>
      <div class="row" id="tools"></div>
      <div class="row"><label>marker kind <input id="kind" value="lantern" size="10" /></label><label><input id="snap" type="checkbox" checked /> snap 0.1 m</label></div>
      <div class="row"><button id="save">Save to src/content/chunks</button><button id="copy">Copy JSON</button><button id="download">Download</button></div>
      <div id="status"></div>
      <div><b>Checks</b><div id="issues"></div></div>
      <div id="help"></div>
    </aside>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
